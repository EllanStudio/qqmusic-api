plugins {
    id 'java'
}

group = 'com.coloryr'
version = '2.2.2'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly 'com.google.code.gson:gson:2.14.0'
    compileOnly 'net.kyori:adventure-text-minimessage:4.26.1'

    testImplementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation 'net.kyori:adventure-text-minimessage:4.26.1'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'qqmusic-api'
}

test {
    useJUnitPlatform()
}

tasks.register('runQrLoginTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coloryr.allmusic.server.core.api.qqmusic.QQMusicQrLoginRunner'
    args project.findProperty('qqmusicTestConfig') ?: 'qqmusic-local-test/qqmusic.json'
}

tasks.register('runSmokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.coloryr.allmusic.server.core.api.qqmusic.QQMusicSmokeRunner'
    args project.findProperty('qqmusicTestConfig') ?: 'qqmusic-local-test/qqmusic.json'
    args project.findProperty('qqmusicTestQuery') ?: '周杰伦'
}
